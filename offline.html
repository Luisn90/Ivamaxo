<title>Sin conexión — IVAMAXO</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat',sans-serif;background:#0A0A0A;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}

p{font-size:13.5px;font-weight:500;line-height:1.6;color:rgba(255,255,255,.5);margin-bottom:26px}
button{background:#F9C200;color:#0A0A0A;border:none;border-radius:50px;padding:13px 30px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s}
button:hover{background:#D9A800;transform:scale(1.03)}
.tel{display:block;margin-top:22px;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.35);text-decoration:none}
.tel:hover{color:#F9C200}

  <p>No pudimos cargar esta página. Revisa tu conexión a internet e inténtalo de nuevo.</p>

// Vuelve solo apenas haya red
